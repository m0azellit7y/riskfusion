server {
  listen 80;
  root /usr/share/nginx/html;
  client_max_body_size 1100m;          # recordings; the API enforces its own limit

  location /api/ {
    proxy_pass http://backend:8000/;   # trailing slash strips the /api prefix
    proxy_request_buffering off;
    proxy_read_timeout 600s;
    proxy_set_header Host $host;
  }
  location / {
    try_files $uri /index.html;        # client-side routing
  }
}
