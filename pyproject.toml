[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "riskfusion"
version = "0.1.0"
description = "RiskFusion — multimodal integrity risk assessment (review-recommendation system, never a verdict)"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["src", "backend"]

[tool.setuptools.package-data]
riskfusion = ["py.typed"]

[project.scripts]
riskfusion = "riskfusion.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["db: requires a running PostgreSQL (RISKFUSION_TEST_DATABASE_URL)", "slow: long-running"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "backend"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*" = ["E501", "W291", "I001"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.10"
mypy_path = ["src", "backend"]
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]

[tool.coverage.run]
source = ["riskfusion", "riskfusion_api"]
